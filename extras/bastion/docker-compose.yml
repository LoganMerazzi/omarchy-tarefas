# Servidor CalDAV das tarefas (Radicale) no Bastion.
# Em /DATA/AppData/radicale/: `docker compose up -d` (ou importe no CasaOS).
# Antes de subir, crie /DATA/AppData/radicale/data/users (uma linha "usuario:hash").
# A porta fica só em 127.0.0.1; o acesso é pela tailnet com HTTPS:
#   tailscale serve --bg 5232   → https://<bastion>.<tailnet>.ts.net/
#   (requer Serve + HTTPS habilitados no tailnet; desfazer: tailscale serve --https=443 off)
name: radicale
services:
  radicale:
    image: tomsquest/docker-radicale:3.9.2.0
    container_name: radicale
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    ports:
      - "127.0.0.1:5232:5232"
    environment:
      RADICALE_CONFIG_AUTH_TYPE: htpasswd
      RADICALE_CONFIG_AUTH_HTPASSWD_FILENAME: /data/users
      RADICALE_CONFIG_AUTH_HTPASSWD_ENCRYPTION: sha512
    volumes:
      - /DATA/AppData/radicale/data:/data
    healthcheck:
      test: curl --fail http://localhost:5232 || exit 1
      interval: 30s
      retries: 3
x-casaos:
  architectures: [amd64, arm64]
  main: radicale
  title:
    en_us: Radicale (tarefas)
  category: Productivity
  port_map: "5232"
